{% extends 'hub/base.html' %}
{% block title %}New Group{% endblock %}
{% block content %}
<div class="container-narrow" style="max-width:520px">
    <div class="page-header"><h2>Create a Group</h2></div>
    <div class="card"><div class="card-body">
        <form method="post">{% csrf_token %}
            <div class="form-group"><label>Group Name</label><input type="text" name="name" class="input" placeholder="The Squad" required></div>
            <button type="submit" class="btn btn-primary btn-block">Create Group</button>
        </form>
    </div></div>
</div>
{% endblock %}
