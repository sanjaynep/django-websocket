{% extends 'hub/base.html' %}
{% block title %}Shared Lists{% endblock %}
{% block content %}
<div class="container-narrow" style="max-width:640px">
    <div class="page-header"><div><h2>Shared Lists</h2></div><a href="{% url 'create_list' group.id %}" class="btn btn-primary btn-sm">New</a></div>
    {% for lst in lists %}
    <a href="{% url 'view_list' group.id lst.id %}" style="text-decoration:none;display:block;margin-bottom:8px"><div class="card"><div class="card-body" style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px"><span style="font-size:14px;font-weight:500;color:#1f2937">{{ lst.name }}</span><span style="font-size:12px;color:#9ca3af">{{ lst.items.count }} items</span></div></div></a>
    {% empty %}
    <div class="card"><div class="empty-state"><p>No shared lists yet.</p><a href="{% url 'create_list' group.id %}" class="btn btn-primary btn-sm">Create a List</a></div></div>
    {% endfor %}
    <div style="margin-top:16px"><a href="/" class="btn btn-ghost btn-sm">Home</a></div>
</div>
{% endblock %}
