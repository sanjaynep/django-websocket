<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Register | BuddyBase</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9fafb;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .c{background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.07);padding:40px;width:100%;max-width:380px}
        .c h1{font-size:22px;font-weight:700;color:#2563eb;margin-bottom:4px;display:flex;align-items:center;gap:8px;justify-content:center}
        .c .sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:28px}
        .fg{margin-bottom:16px}.fg label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
        .i{width:100%;padding:9px 12px;font-size:14px;border:1px solid #d1d5db;border-radius:8px;outline:none}
        .i:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
        .b{width:100%;padding:10px;font-size:14px;font-weight:600;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}
        .b:hover{background:#1d4ed8}
        .l{text-align:center;margin-top:20px;font-size:14px;color:#6b7280}.l a{color:#2563eb;text-decoration:none}
        .icon{width:22px;height:22px}
        .errorlist{color:#dc2626;font-size:13px;margin-bottom:4px;list-style:none;padding:0}
    </style>
</head>
<body>
    <div class="c">
        <h1><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Join BuddyBase</h1>
        <p class="sub">Create your account</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="fg"><label>{{ field.label }}</label>{{ field}}{% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}</div>
            {% endfor %}
            <button type="submit" class="b">Create account</button>
        </form>
        <p class="l">Already have an account? <a href="/login/">Sign in</a></p>
    </div>
</body>
</html>
